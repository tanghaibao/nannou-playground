[package]
name = "nannou-playground"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "archero"
path = "src/archero/main.rs"

[[bin]]
name = "brownian"
path = "src/brownian/main.rs"

[[bin]]
name = "diffusion"
path = "src/diffusion/main.rs"

[[bin]]
name = "fft"
path = "src/fft/main.rs"

[[bin]]
name = "fractal"
path = "src/fractal/main.rs"

[[bin]]
name = "hopfield"
path = "src/hopfield/main.rs"

[[bin]]
name = "pathfinding"
path = "src/pathfinding/main.rs"

[dependencies]
burn = { version = "*", features = ["ndarray"] }
bevy = "*"
bevy-inspector-egui = "*"
bevy_prototype_lyon = "*"
nannou = "*"
pest = "2.1.3"
pest_derive = "2.1.0"
rand = "*"
rand_distr = "*"

# Enable max optimizations for dependencies, but not for our code:
[profile.dev.package."*"]
opt-level = 3
